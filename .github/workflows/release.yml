name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          key_value="$TAURI_SIGNING_PRIVATE_KEY"

          if [[ -z "$key_value" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured."
            exit 1
          fi

          # Tauri accepts the generated key file content (normally one Base64
          # line). Also accept a multiline minisign file for easier Secret setup.
          if [[ "$key_value" == *$'\n'* ]]; then
            if ! grep -q '^untrusted comment: ' <<< "$key_value"; then
              echo "TAURI_SIGNING_PRIVATE_KEY must contain the complete minisign key, including its comment."
              exit 1
            fi
          else
            if ! decoded_key=$(printf '%s' "$key_value" | base64 --decode 2>/dev/null); then
              echo "TAURI_SIGNING_PRIVATE_KEY is not valid Base64."
              exit 1
            fi
            if ! grep -q '^untrusted comment: ' <<< "$decoded_key"; then
              echo "TAURI_SIGNING_PRIVATE_KEY must be the complete generated key, not only the decoded payload or public key."
              exit 1
            fi
          fi

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 签名 + 公证（仅 macOS 任务生效，Windows 忽略这些变量）
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: Guo Shijun (4B75W6C7VS)'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: '4B75W6C7VS'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Desktop Mascot ${{ github.ref_name }}'
          releaseBody: '跨平台桌面宠物 App，基于 Tauri 2 + React 19 + lively-mascot。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
